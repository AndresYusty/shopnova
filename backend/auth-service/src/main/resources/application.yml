server:
  port: ${PORT:8081}
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopnova_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:shopnova}
    password: ${DB_PASSWORD:shopnova123}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:cambie-este-secreto-de-al-menos-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    email: ${ADMIN_EMAIL:admin@shopnova.com}
    password: ${ADMIN_PASSWORD:Admin123*}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
