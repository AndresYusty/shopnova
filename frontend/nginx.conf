# API Gateway + servidor del frontend
# Enruta /api/* hacia cada microservicio, aplica rate limiting y cabeceras de seguridad.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;   # anti fuerza bruta
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;

upstream auth_service     { server auth-service:8081; }
upstream catalog_service  { server catalog-service:8082; }
upstream order_service    { server order-service:8083; }
upstream chatbot_service  { server chatbot-service:8085; }

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    # Cabeceras de seguridad (OWASP A05)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth_service;
    }
    location /api/auth/     { limit_req zone=api_limit burst=100 nodelay; proxy_pass http://auth_service; }
    location /api/products  { limit_req zone=api_limit burst=400 nodelay; limit_req_status 429; proxy_pass http://catalog_service; }
    location /api/orders    { limit_req zone=api_limit burst=400 nodelay; limit_req_status 429; proxy_pass http://order_service; }
    location /api/chat      { limit_req zone=api_limit burst=100 nodelay; limit_req_status 429; proxy_pass http://chatbot_service; }

    # Los endpoints /internal/** NO se publican: solo son accesibles dentro de la red de Docker.
    location /internal { return 404; }

    location = /health { access_log off; return 200 "ok\n"; }
}
